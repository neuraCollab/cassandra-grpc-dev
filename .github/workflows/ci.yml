name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-compose-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Compiling grpc/protobuf/abseil/the Cassandra driver from scratch takes
      # 30-45+ minutes, and a plain `docker build` here has no cache across
      # runs (each GitHub Actions run is a fresh VM). publish-ghcr.yml already
      # builds this exact image with a GitHub Actions cache (scope=base-vcpkg)
      # -- reuse that cache here via Buildx instead of recompiling from zero
      # on every push/PR. `load: true` puts the result into the runner's local
      # Docker daemon so the plain `docker build` steps below can still find
      # it via `FROM base-vcpkg:latest`, same as they always could.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build shared base image (vcpkg manifest, GHA-cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.vcpkg
          load: true
          tags: base-vcpkg:latest
          cache-from: type=gha,scope=base-vcpkg
          cache-to: type=gha,mode=max,scope=base-vcpkg

      # docker-compose.yml now defaults coordinator/worker to prebuilt GHCR
      # `image:` references (their `build:` blocks are commented out, see
      # README "Using Prebuilt Images"), so `docker compose build` has
      # nothing to build for them. This CI job's job is to validate the
      # LOCAL build path (the one developers use when changing C++ code),
      # so build both images directly here, tagged to exactly match the
      # `image:` references in docker-compose.yml -- `docker compose up`
      # uses an image already present locally instead of pulling it, so
      # this doesn't depend on GHCR or its package visibility at all.
      - name: Build coordinator and worker images
        run: |
          docker build -f coordinator/Dockerfile -t ghcr.io/neuracollab/coordinator:latest ./coordinator
          docker build -f worker/Dockerfile -t ghcr.io/neuracollab/worker:latest ./worker

      - name: docker compose up -d
        run: docker compose up -d

      - name: Wait for Cassandra to become healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q cassandra)" 2>/dev/null || echo "starting")
            echo "cassandra health: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Cassandra did not become healthy in time"
          docker compose logs cassandra
          exit 1

      - name: Verify coordinator and worker are running
        run: |
          for service in coordinator worker; do
            cids=$(docker compose ps -q "$service")
            if [ -z "$cids" ]; then
              echo "No container found for $service"
              exit 1
            fi
            # worker scales to 3 replicas (docker-compose.yml deploy.replicas),
            # so this can't assume a single container id per service.
            while IFS= read -r cid; do
              name=$(docker inspect --format='{{.Name}}' "$cid" | sed 's#^/##')
              state=$(docker inspect --format='{{.State.Status}}' "$cid")
              echo "$name state: $state"
              if [ "$state" != "running" ]; then
                echo "$name is not running"
                docker compose logs "$service"
                exit 1
              fi
            done <<< "$cids"
          done

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: docker compose down
        if: always()
        run: docker compose down -v
